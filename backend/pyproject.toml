[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fanwire-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime dependencies only — this is exactly what ships in the Lambda
# container image. Keep it lean; anything dev/test-only goes in
# [project.optional-dependencies].dev instead, per reference/AWS Stack.md
# (Lambda cost is per-GB-second, image bloat is not free).
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",       # 12-factor config from env, reference/Design principles.md
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",                # schema migrations
    "psycopg[binary]>=3.2",         # Postgres driver, SQLAlchemy 2.0-native
    "mangum>=0.19",                 # ASGI-on-Lambda adapter, reference/AWS Stack.md
    "boto3>=1.35",                  # S3, DynamoDB, EventBridge, Secrets Manager, SES, SNS
    "aws-lambda-powertools>=3.0",   # structured logging/metrics/tracing + Idempotency utility
    "python-jose[cryptography]>=3.3",  # verify Cognito JWTs server-side, reference/Security.md
    "pillow>=11.0",                 # media pipeline: type validation, EXIF strip, resize
    "python-multipart>=0.0.12",     # FastAPI file upload parsing
    "email-validator>=2.2",         # Pydantic EmailStr for registration
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",                  # FastAPI TestClient / async client
    "moto[s3,dynamodb,events,secretsmanager,ses,sns]>=5.0",  # mock AWS in unit tests
    "testcontainers[postgres]>=4.8", # real Postgres in a container for integration tests
    "factory-boy>=3.3",
    "faker>=30.0",
    "freezegun>=1.5",               # mock time for TTL/idempotency-key tests
    "ruff>=0.6",                    # lint + format (replaces flake8/isort/black)
    "mypy>=1.11",
    "pip-audit>=2.7",               # CVE scan, reference/Security.md — blocks merge on a hit
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `param: T = Depends(...)` — the call in the
# default is deliberate and immutable per-request, not the mutable-default
# footgun B008 exists to catch. See wiki/CodeContext/Standards/design-principles.md
# "Explicit over implicit" — this is FastAPI's own documented idiom, not a
# workaround.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
# pydantic/pydantic-settings' own mypy plugin understands BaseModel/
# BaseSettings field population (including required-but-undefaulted fields
# populated from the environment, e.g. Settings()), so mypy stops flagging
# a bare Settings() as a missing-argument call — same "fix the false
# positive repo-wide via config, not a scattered ignore" precedent as
# ruff's fastapi.Depends() extend-immutable-calls entry above.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
