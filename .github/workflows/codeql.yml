name: codeql

# Static analysis (SAST) with CodeQL, results to the repository's Security tab
# (code scanning). It closes OpenSSF Scorecard's SAST check, which the first
# Scorecard run (2026-10-19) scored 0: no commit of the last 30 was analysed.
# Three languages: actions (the workflows themselves), javascript-typescript
# (frontend/, infra/) and python (backend/, .ai/).
#
# Advisory. It fails nothing that is required: gate (test-agent.yml) does not
# depend on it, and it is not a required check on main. A required check here
# would block every PR on an external service. A finding is a prompt to read
# it in the Security tab, not a broken build.
#
# It runs on every PR to main, agent/* PRs included, so it must not run the
# PR's code. It does not: every language is analysed with build-mode: none.
# These are interpreted languages, so CodeQL extracts the source text and
# builds nothing; no install, no compile, no script from the checkout runs,
# and no step here has a run: of its own.
#
# Permissions (pinned by test_workflows.py):
#   - permissions: {} at the top; the job is granted contents: read and
#     actions: read, which reading the code and the workflow runs needs, and
#     security-events: write, which uploading results to the Security tab
#     needs. That is the only write, and it can write nothing but a
#     code-scanning result.
#   - no secret is referenced, and no OIDC token is asked for.
#   - the checkout keeps no credential.
#   - the trigger is pull_request, never pull_request_target: a PR from a
#     fork gets GitHub's read-only token and its results are not uploaded,
#     which is GitHub's behaviour and fine here.
#
# Every action is pinned to a full commit SHA.
#
# What only a live run proves: that the actions language analyses this
# repository's workflows with build-mode none, that all three uploads are
# accepted into the Security tab, and how long a run takes (the timeout below
# is a guess with room in it). Scorecard counts SAST over recent commits, so
# its score rises only as analysed commits accumulate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3" # Wednesdays, 05:41 UTC: off the hour, not Scorecard's slot
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # build-mode none: the source is extracted, nothing is built or run.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyse and upload to the Security tab
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:${{ matrix.language }}"
