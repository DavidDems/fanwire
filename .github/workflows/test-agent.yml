name: test-agent

# Runs both test containers on every PR, per
# wiki/CodeContext/Standards/build-deployment.md CI/CD wiring. Deploying is a
# separate workflow, deploy.yml, that this one never calls; it holds no
# AWS credentials and requests no OIDC token.
#
# Despite the name, this workflow is not an agent: it is the repository's
# quality gate, and the agent system treats it as the ONE authoritative test
# executor (.ai/docs/architecture.md). agent-orchestrator.yml triggers it by
# workflow_dispatch on a task branch and reads its conclusion; no agent is ever
# believed about whether tests passed. Nothing else manages workflow state.
#
# ---------------------------------------------------------------------------
# Speed
#
# Every run used to take the same ~3m50s whether the PR changed a Lambda
# handler or a single wiki sentence. That flatness was the diagnosis: the time
# was setup, not testing. Two things fix it, and both are below.
#
#   1. Layer caching. `docker compose run` rebuilt the whole backend image on
#      every run - pip installing psycopg, pillow, boto3, moto and
#      testcontainers from scratch - because nothing persisted between runs.
#      The image is now built by buildx against a cache keyed on the files
#      that actually affect it.
#   2. Path filtering. A PR that only touches `wiki/` or `.ai/docs/` has
#      nothing for the backend suite to prove, so it no longer runs it.
#
# THE SAFETY RULE for #2: filtering applies to `pull_request` ONLY. A
# workflow_dispatch run - which is how the agent orchestrator gets its
# authoritative verdict - always runs every job. A skipped suite reports
# success, and a red baseline that reports success would tell the state
# machine the tests pin something when they pinned nothing. See the `changes`
# job, which hard-codes `true` for every non-PR event.

on:
  pull_request:
    # State and telemetry commits are machine bookkeeping with nothing to test,
    # so they must not re-trigger the gate. `.ai/agentlib/**` and the rest of
    # `.ai/` are deliberately NOT ignored - agent-infra-test below covers them.
    #
    # Scoped to the two bookkeeping paths, NOT all of `.ai/tasks/**`. Ignoring
    # the whole directory also silenced a PR whose only change is a task spec
    # (`task.json` / `brief.md`), and `gate` is a REQUIRED check on `main` - so
    # such a PR got no `gate` run at all and could never merge. Found on
    # 2026-09-29 by PR #71, which amends INFRA-002's `allowed_paths` and nothing
    # else. A spec is also the one input the whole workflow trusts, so it is
    # worth gating; `agent-infra-test` runs `agentctl task validate` over it.
    paths-ignore:
      - ".ai/tasks/*/state.json"
      - ".ai/telemetry/**"
  push:
    branches: [main]
  # Lets agent-orchestrator.yml run the gate against a task branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which suites does this change actually need? Computed with git rather than
  # a third-party filter action: this workflow is the security boundary the
  # whole agent system trusts, and a `git diff` is a thing we can read.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed to diff against the base commit. The repository is small;
          # this costs a couple of seconds and is what makes the rest cheap.
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "$EVENT is not a pull request - running the whole gate"
            printf 'backend=true\nfrontend=true\ninfra=true\nagent=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed.txt
          echo "--- changed ---"; cat /tmp/changed.txt; echo "---------------"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib

          changed = [
              line.strip()
              for line in pathlib.Path("/tmp/changed.txt").read_text().splitlines()
              if line.strip()
          ]

          # A change to the gate itself, or to how any image is built, re-runs
          # everything. Trusting a filter to decide whether to test the filter
          # is how a broken gate ships green.
          EVERYTHING = (".github/workflows/", "docker-compose.yml", "docker/")

          GROUPS = {
              "backend": ("backend/",),
              "frontend": ("frontend/",),
              "infra": ("infra/",),
              "agent": (".ai/",),
          }

          if any(p.startswith(EVERYTHING) for p in changed):
              for name in GROUPS:
                  print(f"{name}=true")
              raise SystemExit(0)

          for name, prefixes in GROUPS.items():
              hit = any(p.startswith(prefixes) for p in changed)
              print(f"{name}={'true' if hit else 'false'}")
          PY
          echo "--- decided ---"; cat "$GITHUB_OUTPUT"

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Docker's own actions, kept to the same major-version pinning as the
      # actions/* above. buildx is what makes a layer cache possible at all;
      # the plain daemon has nowhere to persist one between runs.
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image, reusing cached layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          target: test
          # Must match docker-compose.yml's `image:` so `compose run` finds
          # this image instead of building its own.
          tags: fanwire-backend-test:latest
          load: true
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test
      - name: Run backend test suite
        run: docker compose run --rm backend-test

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image, reusing cached layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: test
          tags: fanwire-frontend-test:latest
          load: true
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test
      - name: Run frontend test suite
        run: docker compose run --rm frontend-test

  # Static checks (handoff.md §10, D5). `tsc` used to run first in deploy.yml,
  # after merge, and ruff, mypy and eslint only when a session ran them by hand,
  # which a worker cannot. Each runs in the image its suite runs in, from the
  # suite's directory, with the suite's config (backend/pyproject.toml,
  # frontend/tsconfig*.json and eslint.config.js), and is keyed on the same
  # `changes` output, so a dispatched run never skips one.
  #
  # One tool per job, not steps inside backend-test/frontend-test: the job is
  # what `gh run view --log-failed` attributes each line to, and what
  # .ai/agentlib/ciresult.py reads to decide whether a red baseline is red for
  # the right reason (STATIC_JOBS there is pinned to these names), so a job
  # name has to say which tool's output a log holds. A red typecheck also
  # cannot hide whether lint would have passed. The cost is an image load from
  # the layer cache per job, in parallel. These read the suites' cache and
  # never write it.
  #
  # Output flags are for that parser: ruff's one-line `concise` format, tsc
  # without its pretty-printer, and -T so nothing sees a TTY. mypy checks
  # `app` only: a test commit adds tests that import modules not written yet,
  # and type-checking those would only repeat what the suite already says.
  backend-ruff:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image, reusing cached layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          target: test
          tags: fanwire-backend-test:latest
          load: true
          cache-from: type=gha,scope=backend-test
      - name: Lint the backend (ruff)
        run: docker compose run --rm -T --no-deps --entrypoint python backend-test -m ruff check --output-format concise .

  backend-mypy:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image, reusing cached layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          target: test
          tags: fanwire-backend-test:latest
          load: true
          cache-from: type=gha,scope=backend-test
      - name: Type-check the backend application (mypy, strict)
        run: docker compose run --rm -T --no-deps --entrypoint python backend-test -m mypy app

  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image, reusing cached layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: test
          tags: fanwire-frontend-test:latest
          load: true
          cache-from: type=gha,scope=frontend-test
      - name: Type-check the frontend (tsc)
        run: docker compose run --rm -T --no-deps --entrypoint npm frontend-test run typecheck -- --pretty false

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image, reusing cached layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: test
          tags: fanwire-frontend-test:latest
          load: true
          cache-from: type=gha,scope=frontend-test
      - name: Lint the frontend (eslint)
        run: docker compose run --rm -T --no-deps --entrypoint npm frontend-test run lint

  # The agent system's own deterministic core (.ai/agentlib). Stdlib only, so
  # this needs pytest and nothing else. It gates the state machine, the
  # permission guard and the telemetry writer the same way the application
  # suites gate the application.
  agent-infra-test:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8.3"
      - name: Run agent infrastructure test suite
        working-directory: .ai
        run: python -m pytest -q
      - name: Selfcheck - state machine, guard, policy and every task spec
        run: python .ai/bin/agentctl.py selfcheck

  pip-audit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # This job installed the whole dev tree - moto, testcontainers,
          # pillow - from scratch on every run, in parallel with the backend
          # image doing the same thing.
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend package
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Audit for known CVEs (blocks on any unignored finding)
        working-directory: backend
        # No ignores. The one there was (PYSEC-2026-1325, ecdsa) went with
        # python-jose, which pulled ecdsa in; JWT verification is PyJWT since
        # 2026-10-06 (wiki/CodeContext/Modules/0x01-users.md).
        run: pip-audit

  # `backend/openapi.json` is the committed frontend/backend contract, and
  # `frontend/src/api/schema.d.ts` is the TypeScript generated from it. Either
  # one stale builds the client against a schema the API no longer serves, and
  # nothing fails until runtime. Regenerate both here - the types from the
  # fresh export, not the committed one - and fail on any difference.
  #
  # Runs on backend OR frontend changes: a route change moves both files, and
  # a hand-edit of the generated types moves only the second.
  #
  # `git status --porcelain` rather than `git diff --exit-code`: a diff only
  # sees tracked files, so a deleted-and-regenerated or never-committed file
  # would pass. Backend runtime dependencies only - the export imports
  # `app.main` and nothing else, with no database or AWS configured.
  openapi-drift:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend package (runtime dependencies only)
        working-directory: backend
        run: pip install -e .
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate the OpenAPI document
        working-directory: backend
        run: python scripts/export_openapi.py
      - name: Regenerate the TypeScript API types from it
        working-directory: frontend
        run: npm run gen:api-types
      - name: Fail on any drift from the committed contract
        run: |
          set -euo pipefail
          drift="$(git status --porcelain -- backend/openapi.json frontend/src/api/schema.d.ts)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff --stat -- backend/openapi.json frontend/src/api/schema.d.ts || true
            echo "::error::The API contract is out of date. From backend/, run: python scripts/export_openapi.py. Then from frontend/, run: npm run gen:api-types. Commit both files."
            exit 1
          fi
          echo "backend/openapi.json and frontend/src/api/schema.d.ts match a fresh export"

  npm-audit:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit for known CVEs (blocks on critical)
        working-directory: frontend
        run: npm audit --audit-level=critical

  # CDK type-check, lint, tests and synth, including test/iam-policy.test.ts
  # (the IAM wildcard gate) -- a merge gate, not a deploy. No AWS credentials
  # are configured for this job and it never runs cdk deploy/diff/bootstrap.
  # Synth stages the Lambda image's build context but doesn't build the
  # image, so no Docker is needed here.
  infra-synth:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run synth

  # One check that always reports, whatever the filter decided.
  #
  # Required status checks name a JOB, and a job the filter skipped never
  # reports at all - which a protected branch reads as "still waiting", not as
  # "not needed", and the PR can never merge. This job always runs, so it is
  # the one to require on `main` once branch protection is switched on.
  #
  # `success()` is deliberately not used: it treats a skipped dependency as
  # not-success. Here a skip is the correct outcome and must pass, while a
  # failure or a cancellation must not.
  gate:
    if: always()
    needs:
      - changes
      - backend-test
      - frontend-test
      - backend-ruff
      - backend-mypy
      - frontend-typecheck
      - frontend-lint
      - agent-infra-test
      - pip-audit
      - openapi-drift
      - npm-audit
      - infra-synth
    runs-on: ubuntu-latest
    steps:
      - name: Report the gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          bad = sorted(
              name
              for name, job in results.items()
              if job.get("result") in {"failure", "cancelled"}
          )
          for name, job in sorted(results.items()):
              print(f"  {job.get('result','?'):<10} {name}")
          if bad:
              sys.exit("gate failed: " + ", ".join(bad))
          print("\ngate passed")
          PY
