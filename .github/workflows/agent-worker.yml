name: agent-worker

# Runs exactly one agent, for one role, for one task, then terminates.
#
# The worker is the only place a model is invoked, and it is deliberately dumb:
# it does not decide anything. It assembles the prompt from durable state,
# invokes the provider, checks the resulting diff against the permission model,
# commits or escalates, records what was spent, and hands control back to the
# orchestrator.
#
# Least privilege notes, because this is where a compromised or manipulated
# agent would do damage:
#   * `contents: write` is the only broad permission, and it is scoped to a
#     task branch by the guard step below, not by trust.
#   * The agent process itself runs with NO GitHub token, in its environment
#     or on disk (see "Invoke the agent" and the checkout). Only the steps
#     around it can talk to the API, and the job token reaches exactly two of
#     them: the push and the hand-off.
#   * The task id is validated before anything uses it, and no dispatch input
#     is ever pasted into a script — inputs reach the shell through `env:`.
#   * The provider credential is present only for that one step.
#   * A guard violation is not retried. It escalates to a human.

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task id, e.g. DEMO-001"
        required: true
      role:
        description: "manager | test_agent | code_agent | context_maintainer"
        required: true

permissions:
  contents: write
  actions: write # hand control back to agent-orchestrator.yml

concurrency:
  group: agent-worker-${{ github.event.inputs.task_id }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TASK_ID: ${{ github.event.inputs.task_id }}
      ROLE: ${{ github.event.inputs.role }}
      BRANCH: agent/${{ github.event.inputs.task_id }}
      # The workflow's own scratch files (prompt, context, agent result) must
      # NOT live inside the checkout. They are not the agent's work, but
      # `git add -A` stages them all the same and the guard then — correctly —
      # rejects the diff for containing paths no role may write. That is how
      # run 35556225202 died: the test agent wrote exactly the right file, and
      # was failed for prompt.md, context.json and agent-result.json sitting
      # next to it.
      #
      # The steps use the $RUNNER_TEMP shell variable directly. Do NOT lift it
      # to a job-level WORK built from the `runner` context: that context is not
      # available in `jobs.<id>.env`, and GitHub rejects the entire workflow
      # file when it appears there — run 35556516395 failed with "workflow file
      # issue" and no job at all. A YAML parser cannot see that; only a push can.
    steps:
      # handoff.md §10, D2. The id becomes a branch name, a path under
      # .ai/tasks/ and an argument to every agentctl call below, and anyone
      # with `actions: write` can dispatch this workflow with any string at
      # all. It is checked before anything uses it, against the guard's own
      # TASK_ID_SAFE. That is a copy, in bash, because this runs before the
      # checkout and there is no repository code to import yet;
      # test_workflows.py fails if it drifts from agentlib/guard.py. The id
      # itself is never echoed: it is exactly the string not to trust.
      - name: Refuse a malformed task id
        run: |
          set -euo pipefail
          export LC_ALL=C # [A-Z] means A to Z, not a locale's collation order
          TASK_ID_SAFE='^[A-Z][A-Z0-9]{0,15}-[0-9]{3,5}$'
          if ! [[ "$TASK_ID" =~ $TASK_ID_SAFE ]]; then
            echo "::error::task id does not match $TASK_ID_SAFE; refusing to run"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: agent/${{ github.event.inputs.task_id }}
          fetch-depth: 0
          # handoff.md §10, D2. By default checkout leaves the job token in
          # .git/config for the whole job, and the model reads files. Blanking
          # the environment variables in "Invoke the agent" meant nothing while
          # this was true. The one later network operation, the push,
          # authenticates for itself.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Provider-specific, like invoke_agent.sh itself. A self-hosted runner
      # with the CLI already present can drop this step; on GitHub-hosted
      # runners it is the only way the CLI exists at all.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the provider CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Refuse an unknown role
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          role = os.environ["ROLE"]
          policy = json.load(open(".ai/policy.json", encoding="utf-8"))
          entry = policy["roles"].get(role)
          if entry is None or not entry.get("ci_dispatched"):
              print(f"::error::{role!r} is not a CI-dispatchable role")
              sys.exit(1)
          PY

      - name: Assemble the prompt from durable state
        id: prompt
        run: |
          set -euo pipefail
          python .ai/bin/agentctl.py context "$TASK_ID" > "$RUNNER_TEMP/context.json"
          python .ai/bin/agentctl.py prompt "$TASK_ID" --role "$ROLE" --out "$RUNNER_TEMP/prompt.md"
          echo "--- prompt ($(wc -c < "$RUNNER_TEMP/prompt.md") bytes) ---"
          head -40 "$RUNNER_TEMP/prompt.md"

      - name: Record the start time
        id: clock
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Invoke the agent
        id: agent
        continue-on-error: true
        env:
          # The one provider-specific seam in the whole system. Everything else
          # is provider-agnostic; swapping providers means editing
          # .ai/bin/invoke_agent.sh and .ai/config.json, and nothing else.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deliberately blank. The agent must not be able to reach the GitHub
          # API, dispatch workflows, or touch branch protection, whatever it is
          # told to do by content it reads. Blank variables are only half of
          # that; the other half is `persist-credentials: false` on the
          # checkout, without which the token sits in .git/config.
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: bash .ai/bin/invoke_agent.sh "$ROLE" "$RUNNER_TEMP/prompt.md" "$RUNNER_TEMP/agent-result.json"

      - name: Record what the invocation cost
        if: always()
        env:
          STARTED: ${{ steps.clock.outputs.started }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          set -euo pipefail
          python .ai/bin/agentctl.py telemetry-from-run \
            --task "$TASK_ID" --role "$ROLE" \
            --started "$STARTED" \
            --workflow-run-id "${{ github.run_id }}" \
            --agent-result "$RUNNER_TEMP/agent-result.json" \
            --result "$AGENT_OUTCOME"

      - name: Stop here if the provider call failed
        if: steps.agent.outcome == 'failure'
        run: |
          set -euo pipefail
          python .ai/bin/agentctl.py state advance "$TASK_ID" \
            --event AGENT_FAILED --reason "provider invocation failed in run ${{ github.run_id }}"
          echo "::warning::agent invocation failed; task routed to MANAGER_REVIEW"

      - name: Check the diff against the permission model
        if: steps.agent.outcome == 'success'
        id: guard
        # Without this the step's failure fails the JOB, so the escalate step
        # below never runs, the state is never advanced, and the task sits in
        # *_RUNNING forever. A boundary violation must be recorded and routed,
        # never silently dropped.
        continue-on-error: true
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only > "$RUNNER_TEMP/changed.txt"
          # State and telemetry are written by the steps around the agent, not
          # by the agent, and are not part of what it is permitted to produce.
          grep -v '^\.ai/' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/agent-changed.txt" || true
          echo "--- agent touched ---"; cat "$RUNNER_TEMP/agent-changed.txt"
          python .ai/bin/agentctl.py guard check "$TASK_ID" \
            --role "$ROLE" --diff-file "$RUNNER_TEMP/agent-changed.txt"

      - name: Escalate a boundary violation
        if: steps.agent.outcome == 'success' && steps.guard.outcome == 'failure'
        run: |
          set -euo pipefail
          git reset --hard HEAD
          python .ai/bin/agentctl.py state advance "$TASK_ID" \
            --event GUARD_VIOLATION \
            --reason "role $ROLE wrote outside its permitted paths in run ${{ github.run_id }}"
          echo "::error::$ROLE wrote outside its permitted paths. Work discarded, task escalated."
          # The state is now ESCALATED and will be pushed by the always() step
          # below; fail the job so the run is visibly red, not quietly green.
          exit 1

      - name: Commit the work
        if: steps.agent.outcome == 'success' && steps.guard.outcome == 'success'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "fanwire-$ROLE"
          git config user.email "noreply@github.com"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "the agent produced no diff"
          else
            case "$ROLE" in
              test_agent) VERB="test" ;;
              code_agent) VERB="impl" ;;
              context_maintainer) VERB="wiki" ;;
              *) VERB="chore" ;;
            esac
            git commit -m "$TASK_ID $VERB: $(python .ai/bin/agentctl.py summary-line --agent-result "$RUNNER_TEMP/agent-result.json")"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Advance the workflow
        if: steps.agent.outcome == 'success' && steps.guard.outcome == 'success'
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          case "$ROLE" in
            context_maintainer) EVENT=MAINTAINER_DONE ;;
            manager)            EVENT="$(python .ai/bin/agentctl.py manager-decision --agent-result "$RUNNER_TEMP/agent-result.json")" ;;
            *)                  EVENT=AGENT_COMMITTED ;;
          esac
          python .ai/bin/agentctl.py state advance "$TASK_ID" \
            --event "$EVENT" --commit-sha "$COMMIT_SHA" \
            --role "$ROLE" --session-id "$(python .ai/bin/agentctl.py session-id --agent-result "$RUNNER_TEMP/agent-result.json")"

      - name: Commit state and telemetry
        id: state_commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "fanwire-$ROLE"
          git config user.email "noreply@github.com"
          git add .ai/tasks/ .ai/telemetry/ || true
          git diff --cached --quiet || git commit -m "[agent-state] $TASK_ID: $ROLE finished"

      # The only step after the model that holds the job token, and all it
      # does is push: `git add`/`git commit` stay in the tokenless step above,
      # because they run hooks, filters and fsmonitor out of a .git directory
      # the model has just had write access to. Skipped only if that commit
      # failed, which used to stop the push in the same way under `set -e`.
      #
      # The credential is an http.extraheader passed through GIT_CONFIG_* for
      # this one git process, the same header actions/checkout would have
      # persisted, so it is never written to .git/config and never appears in
      # argv. GitHub masks the raw token in logs but not this base64 of it, so
      # it is masked explicitly before anything can print it. The URL scope
      # keeps the header from being sent to any host but github.com.
      - name: Push state and work
        if: always() && steps.state_commit.outcome == 'success'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git push origin HEAD:"$BRANCH"

      - name: Hand control back to the orchestrator
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN || github.token }}
        run: |
          gh workflow run agent-orchestrator.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f task_id="$TASK_ID"
